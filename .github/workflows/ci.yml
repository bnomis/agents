name: CI

on:
  push:
  pull_request:

# The job needs no write access to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Python 3.14, pyproject.toml's requires-python.
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv tool install pre-commit
      - run: uv sync
      # The audit hooks run `ruff` from PATH: use the project's locked one.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv run pytest claude/skills/survey/tests claude/skills/test-log-review/tests claude/skills/todo-review/tests tests -q -p no:cacheprovider
      # The audit hooks live in the private auditor repository; pre-commit
      # clones it over SSH with a read-only deploy key. GitHub accepts a deploy
      # key on one repository only, so the key sits under its own host alias.
      # It is installed only now, after every third-party action and the tests
      # have run, and the host keys come from GitHub's API over TLS.
      - name: Install the audit deploy key
        env:
          AUDITOR_DEPLOY_KEY: ${{ secrets.AUDITOR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUDITOR_DEPLOY_KEY" > ~/.ssh/auditor_deploy_key
          chmod 600 ~/.ssh/auditor_deploy_key
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          {
            echo 'Host github-auditor'
            echo '  HostName github.com'
            echo '  User git'
            echo '  IdentityFile ~/.ssh/auditor_deploy_key'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
          } >> ~/.ssh/config
          git config --global url."git@github-auditor:bnomis/auditor.git".insteadOf "git@github.com:bnomis/auditor.git"

      # The commit-time checks, over the whole tree.
      - run: pre-commit run --all-files

      # The whole-tree audit, which the commit hook scopes to changed files.
      - name: Audit the whole tree
        run: pre-commit run auditme-all --hook-stage manual --all-files

      # Remove the key whether or not the checks passed.
      - name: Remove the audit deploy key
        if: always()
        run: rm -f ~/.ssh/auditor_deploy_key
