[project]
name = "agents"
description = "agent files"
version = "0.1.0"
requires-python = ">=3.14.7,<3.15"

[tool.ruff]
line-length = 160

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# B: flake8-bugbear
# E: pycodestyle
# F: Pyflakes
# I: isort
# ICN: import convention
# S: bandit
# SIM: flake8-simplify
# TID: tidy imports
# UP: pyupgrade
select = [
    "B",
    "E",
    "F",
    "I",
    "ICN",
    "S",
    "SIM",
    "NPY201",
    "TID",
    # "UP",
]
# ignore
# E501 (line length violations)
# E722 Do not use bare `except`
# ICN001 import numpy, pandas ok
# SIM108 Use ternary operator
# SIM102 collapsible-if
# S110 try/except/pass
# S311 random
ignore = ["E501", "E722", 'ICN001', 'SIM108', 'SIM102', 'S110', 'S311']

[tool.ruff.lint.per-file-ignores]
# S101 assert: pytest reports failures through bare asserts.
# The root-level tests run the shipped installer as a subprocess from PATH;
# that is the behaviour under test.
"tests/*" = ["S101", "S603", "S607"]
# S603/S607 subprocess: the survey inventory runs `git` from PATH on the
# repositories it reports on; that is its whole job, and its tests build
# throwaway repositories with it.
"claude/skills/survey/inventory.py" = ["S603", "S607"]
"claude/skills/survey/tests/*" = ["S101", "S603", "S607"]
"claude/skills/test-log-review/tests/*" = ["S101"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.uv]
exclude-newer = "14 days"
prerelease = "disallow"

[dependency-groups]
dev = ["ruff>=0.17.2"]
docs = ["mkdocs>=1.6.1", "mkdocs-material>=9.7.7"]
