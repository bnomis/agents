[project]
name = "agents"
description = "agent files"
version = "0.1.0"

[tool.ruff]
line-length = 160

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# B: flake8-bugbear
# E: pycodestyle
# F: Pyflakes
# I: isort
# ICN: import convention
# S: bandit
# SIM: flake8-simplify
# TID: tidy imports
# UP: pyupgrade
select = [
    "B",
    "E",
    "F",
    "I",
    "ICN",
    "S",
    "SIM",
    "NPY201",
    "TID",
    # "UP",
]
# ignore
# E501 (line length violations)
# E722 Do not use bare `except`
# ICN001 import numpy, pandas ok
# SIM108 Use ternary operator
# SIM102 collapsible-if
# S110 try/except/pass
# S311 random
ignore = ["E501", "E722", 'ICN001', 'SIM108', 'SIM102', 'S110', 'S311']

[tool.ruff.lint.per-file-ignores]
# S101 assert: pytest reports failures through bare asserts.
# S603/S607 subprocess: the driver test runs the shipped entry point as a
# subprocess and the hygiene test probes for `ruff` on PATH exactly as the
# checker does. Both are the behaviour under test.
"claude/skills/auditme/tests/*" = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
combine-as-imports = true
